[package]
name = "nodem-rs"
version = "0.1.1"
edition = "2021"
authors = ["Sascha Klick"]
repository = "https://github.com/saschaklick/nodem-rs"
description = "Rust implementation of the nodem UI rendering framework"
license = "MIT"

[features]
std=["bytes", "virtmach/std"]
inspect = []
dom = []
xml = []
ninepatch = []
vm = ["virtmach"]
runtime = ["std"]
compile = ["vm", "alloc", "virtmach/compile"]
basic = ["compile", "virtmach/basic"]
alloc = ["virtmach/alloc"]
ui = []
term = []
base = ["dom", "xml", "ninepatch", "inspect"]
# Runtime draws an animated cursor and a periodic "DEMO" popup over every page.
demo = []

[dependencies]
log = "0.4.27"
bytes = { version = "1.10.1", optional = true, default-features = false }
nostd = "0.1.6"
nostd_structs = "0.5.0"
virtmach = { git = "https://github.com/saschaklick/virtmach-rs", features = ["i16", "random"], optional = true }

[dev-dependencies]
simple_logger = "5.0.0"
bytes = { version = "1.10.1" }
tokio = { version = "1.45.1", features = ["full"] }
sdl2 = { version = "0.37.0" }
bitmap_writer = { version = "0.1.2", features = ["std"] }
test-log = "0.2.19"
rustix = "=1.1.4"
